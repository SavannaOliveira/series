<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
	<head>
	    <meta charset="UTF-8">
	  
	    <link rel="stylesheet" href="/css/estilo.css">
	</head>

    <table border="2">
        <thead>
            <tr >
                <th> Nome </th>
                <th> Plataforma </th>
                <th> Ano </th>
                <th> Gênero </th>
            </tr>
        </thead>
        <tbody>
            <tr  th:each="serie : ${series}">
                <td th:text="${serie.nome}">Nome</td>
                <td th:text="${serie.plataforma}">Plataforma</td>
                <td th:text="${serie.anoLancamento}">Ano</td>
                <td th:text="${serie.genero}">Gênero</td>
                
                <td>
					<a th:href="@{/paginas/series/{id}/editar(id=${serie.id})}">Editar</a>	
					<form th:action="@{/paginas/series/{id}/remover(id=${serie.id})}" method="post">
        			<button type="submit">Remover</button>
    				</form>
					
			    </td>
                
            </tr>
        </tbody>
    </table>
